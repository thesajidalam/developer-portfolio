name: Portfolio Submission
description: Submit a developer portfolio to the Developer Portfolio directory
title: "[Portfolio] "
labels: ["portfolio-submission"]
body:
  - type: input
    id: portfolio-url
    attributes:
      label: Portfolio URL
      description: The full URL of the portfolio to submit
      placeholder: "https://example.dev"
    validations:
      required: true

  - type: input
    id: developer-name
    attributes:
      label: Developer Name
      description: Name of the portfolio owner
      placeholder: "Jane Doe"
    validations:
      required: true

  - type: input
    id: github-url
    attributes:
      label: GitHub Profile
      description: GitHub profile URL (optional)
      placeholder: "https://github.com/janedoe"

  - type: dropdown
    id: experience-level
    attributes:
      label: Experience Level
      description: Estimated experience level of the portfolio owner
      options:
        - Junior
        - Mid
        - Senior
        - Lead
        - Principal
    validations:
      required: true

  - type: textarea
    id: technologies
    attributes:
      label: Technologies Used
      description: List the main technologies, frameworks, and tools featured
      placeholder: |
        React, TypeScript, Tailwind CSS, Vercel
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Why is this portfolio notable?
      description: Brief description of what makes this portfolio stand out
      placeholder: "Clean design, excellent project case studies, strong accessibility..."
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I confirm this portfolio is publicly accessible
          required: true
        - label: I am the owner or have permission to submit this portfolio
          required: false
